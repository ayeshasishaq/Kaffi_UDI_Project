  docker-build-frontend:
    runs-on: ubuntu-latest
    steps: 

      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Login to azure image repository
        uses: docker/login-action@v4
        with:
          registry: ${{vars.ACR_RegisteryName}}
          username: ${{secrets.ACR_USERNAME}}
          password: ${{secrets.ACR_PASSWORD}}

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Generate timestamp
        id: ts
        run: echo "value=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"  

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend/kaffi.frontend
          push: true
          tags: ${{ vars.ACR_RegisteryName }}/frontend:${{ steps.ts.outputs.value }}

